<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مكتبة الحي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0f0e0c;
      --surface:   #1a1814;
      --surface2:  #242018;
      --gold:      #c9a84c;
      --gold-light:#e8c97a;
      --gold-dim:  #7a6330;
      --cream:     #f0e6cc;
      --cream-dim: #a89878;
      --red:       #c0392b;
      --green:     #27ae60;
      --border:    rgba(201,168,76,0.18);
      --shadow:    0 8px 40px rgba(0,0,0,0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      max-width: 780px;
      padding: 48px 24px 0;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeDown 0.8s ease both;
    }

    .header-ornament {
      font-family: 'Amiri', serif;
      font-size: 1.1rem;
      color: var(--gold-dim);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 700;
      color: var(--gold);
      line-height: 1.15;
      text-shadow: 0 2px 24px rgba(201,168,76,0.25);
    }

    .subtitle {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--cream-dim);
      font-weight: 300;
    }

    .divider {
      margin: 20px auto;
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* ===== CHAT WRAPPER ===== */
    .chat-wrapper {
      width: 100%;
      max-width: 780px;
      padding: 0 16px 120px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.9s ease 0.2s both;
    }

    /* ===== MESSAGES ===== */
    #messages {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 8px 0 24px;
      min-height: 200px;
    }

    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: msgIn 0.35s ease both;
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      border: 1.5px solid var(--border);
    }

    .msg.user .avatar {
      background: var(--gold-dim);
      color: var(--bg);
    }

    .msg.assistant .avatar {
      background: var(--surface2);
      color: var(--gold);
    }

    .bubble {
      max-width: 72%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.7;
      position: relative;
    }

    .msg.user .bubble {
      background: var(--gold-dim);
      color: var(--cream);
      border-bottom-left-radius: 4px;
    }

    .msg.assistant .bubble {
      background: var(--surface);
      color: var(--cream);
      border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
    }

    /* ===== TYPING INDICATOR ===== */
    .typing-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      padding: 14px 20px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: var(--gold-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

    /* ===== WELCOME CARD ===== */
    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 8px;
    }

    .welcome-card .icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .welcome-card h2 {
      font-family: 'Amiri', serif;
      font-size: 1.3rem;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 0.9rem;
      color: var(--cream-dim);
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .suggestion-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--cream-dim);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.08);
    }

    /* ===== INPUT AREA ===== */
    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 780px;
      padding: 16px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      z-index: 100;
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--cream);
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
      line-height: 1.6;
      direction: rtl;
    }

    #userInput::placeholder { color: var(--cream-dim); opacity: 0.5; }

    #sendBtn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--gold);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: var(--bg);
    }

    #sendBtn:hover { background: var(--gold-light); transform: scale(1.05); }
    #sendBtn:disabled { background: var(--gold-dim); opacity: 0.5; cursor: not-allowed; transform: none; }

    #sendBtn svg { width: 18px; height: 18px; }

    /* ===== STATUS BAR ===== */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 4px 0;
      font-size: 0.78rem;
      color: var(--cream-dim);
      opacity: 0.6;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      h1 { font-size: 2rem; }
      .bubble { max-width: 86%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-ornament">✦ مكتبة الحي ✦</div>
    <h1>مساعد المكتبة الذكي</h1>
    <p class="subtitle">ابحث عن كتابك المفضل، واقترح واستعِر بكل سهولة</p>
    <div class="divider"></div>
  </header>

  <div class="chat-wrapper">
    <div id="messages">
      <div class="welcome-card">
        <div class="icon">📚</div>
        <h2>أهلاً بك في مكتبة الحي!</h2>
        <p>يمكنني مساعدتك في البحث عن الكتب، اقتراح بدائل، وحفظ آرائك. جرب أحد الأسئلة التالية:</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="sendSuggestion('هل عندك روايات خيال علمي؟')">🚀 خيال علمي</button>
          <button class="suggestion-btn" onclick="sendSuggestion('أبحث عن كتاب عن الفلسفة')">🧠 فلسفة</button>
          <button class="suggestion-btn" onclick="sendSuggestion('اقترح لي رواية ممتعة')">✨ اقتراح</button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا..."></textarea>
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>المساعد متصل</span>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/chat";
    const SESSION_ID = "user_" + Math.random().toString(36).substr(2, 9);

    // List of books from books.json for random selection


    const messagesEl = document.getElementById("messages");
    const inputEl    = document.getElementById("userInput");
    const sendBtn    = document.getElementById("sendBtn");

    // Auto-resize textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    });

    // Enter to send (Shift+Enter for newline)
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function getRandomBook() {
      return BOOKS_LIST[Math.floor(Math.random() * BOOKS_LIST.length)];
    }

    function sendRandomBook() {
      const randomBook = getRandomBook();
      const message = `هل عندك كتاب ${randomBook}؟`;
      inputEl.value = message;
      sendMessage();
    }

    function sendSuggestion(text) {
      inputEl.value = text;
      sendMessage();
    }

    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function appendMessage(role, text) {
      const isUser = role === "user";
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = `
        <div class="avatar">${isUser ? "👤" : "📚"}</div>
        <div class="bubble">${text.replace(/\n/g, "<br>")}</div>
      `;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "msg assistant";
      div.id = "typing";
      div.innerHTML = `
        <div class="avatar">📚</div>
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
      `;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      // Reset input
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;

      // Show user message
      appendMessage("user", text);
      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: SESSION_ID, message: text })
        });

        const data = await res.json();
        hideTyping();
        appendMessage("assistant", data.reply || "عذراً، حدث خطأ.");
      } catch (err) {
        hideTyping();
        appendMessage("assistant", "⚠️ تعذر الاتصال بالخادم. تأكد من تشغيل الـ Backend.");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
